[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdproduct"
version = "0.1.0"
description = "pd_product: PD blood-protein to brain-gene intervention model track (CCWM equilibrium simulator); platform components copied from pd_bbm"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.scripts]
pdproduct = "pdproduct.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
