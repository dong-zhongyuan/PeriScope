# METHOD CAPABILITY REGISTRY — pd_bbm / NeuroBridge-VT
# 版本: Phase A 草案 v1 | 日期: 2026-08-17 | 依据: docs/HANDOFF_SERVER_V1.md §7 §14 §28 + skills/ 目录审计
# 状态口径（五级，见 HANDOFF_SERVER_V1 §14.3）:
#   KNOWLEDGE-ONLY     只有方法卡/论文信息
#   SOURCE-AVAILABLE   源码固定，但环境/权重/测试不全
#   CHALLENGER         能运行，只进 benchmark
#   CONDITIONALLY-READY 限定数据域/panel/任务上通过门
#   PRODUCTION-ELIGIBLE 通过独立复现/许可/校准/拒答/回放
# 当前全服务器没有任何方法达到 CONDITIONALLY-READY 及以上；checkpoint-reproduced = 0。
# upstream_evidence 取自 skills source-ledger（仅覆盖 12 个空间方法），其余为 knowledge-card。

meta:
  registry_version: 0.1.0-phaseA
  last_verified: 2026-08-17
  verifier: ZCode agent (Phase A, design-only)
  skill_root_host: /public/home/mengxl/dzy/skills
  skill_root_container: /home/node/dzy/skills
  note: >
    本表当前是知识资产登记，不是可执行专家清单。任何方法升级到 CHALLENGER
    必须满足 HANDOFF_SERVER_V1 §7.4 的 12 项准入条件并单独 ADR。

# ── 空间与跨模态（source-ledger 覆盖的 12 个） ──────────────────────────

methods:
  - method_id: scipenn
    category: rna_to_protein
    io: {input_modalities: [rna], output_modalities: [adt_protein], entity_level: [cell]}
    upstream_evidence: metadata-verified
    readiness: CHALLENGER   # 2026-08-19 G2 实测（RF-001 已撤回，依据被上游 build_dir bug 推翻）
    core_capability: 配对 CITE-seq 训练，从 scRNA 预测有限蛋白 panel
    candidate_role: RNA→surface-protein challenger（运行于 Hao 基准：0.380 vs Ridge 0.376，+1.2% 噪声内）
    legal_output: 训练 panel 词表内的预测蛋白（ADT 量纲）
    forbidden: [冒充 plasma protein 浓度, panel 外蛋白 zero-shot 主张, 称显著超越基线, PD 域直接使用（未评估）]
    mvp_role: "CHALLENGER（2026-08-19：G2 实测 0.3802 vs Ridge 0.3759，+1.2% 未达显著增益门；训练 ~3min/内存正常，需 3 个已记录环境补丁；判定文档 results/index/G2_scipenn_revision_v1.md）"
    cost_profile: "train ~3min (50K cells, batch512, ES@35ep), host RAM normal, GPU normal; 3 upstream patches required (numba pin, gene_normalize branch, build_dir infinite loop)"
    calibration_capability: "q10-q90 分位数区间为有效置信代理（2026-08-19 风险-覆盖翻盘验证：最自信层 rho 0.943 vs 最不自信 0.511，Δ+0.23）——平台拒答分层机制的当前依据"

  - method_id: sctranslator
    category: rna_to_protein
    io: {input_modalities: [rna], output_modalities: [adt_protein], entity_level: [cell]}
    upstream_evidence: code-verified
    readiness: SOURCE-AVAILABLE   # 容器 /home/node/dzy/sctranslator 仅源码 checkout
    core_capability: RNA→蛋白翻译，强调跨数据映射
    candidate_role: challenger
    legal_output: 模型支持词表内的单细胞蛋白丰度预测
    forbidden: [称已安装/已有权重, 无微调推理解释成任意新蛋白或 PD 域 zero-shot, 冒充校准不确定性]
    mvp_role: 暂缓（D8：先做许可与环境审计；无权重、环境不兼容 torch1.12/py3.8 vs 容器 torch2.2/py3.11）

  - method_id: spider
    category: rna_to_protein
    upstream_evidence: metadata-verified
    readiness: KNOWLEDGE-ONLY
    core_capability: 单细胞 RNA→蛋白预测路线
    candidate_role: registry 节点
    legal_output: 模型支持词表中的表面蛋白预测
    forbidden: [unseen-protein zero-shot 未逐 cohort 验证即主张]
    mvp_role: 不进 MVP

